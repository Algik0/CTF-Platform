<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorDocument 404 /404.php

    RewriteEngine On
    # /api/v1/gallery/preview (ohne .php) -> preview.php, Query-String erhalten
    RewriteRule ^/api/v1/gallery/preview$ /api/v1/gallery/preview.php [QSA,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
